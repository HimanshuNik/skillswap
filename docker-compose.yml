version: '3.8'

services:
  # ==========================================
  # Database: PostgreSQL 15 Engine
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: skillswap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillswap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillswap_secure_password_prod}
      POSTGRES_DB: ${POSTGRES_DB:-skillswap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillswap} -d ${POSTGRES_DB:-skillswap}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skillswap-net

  # ==========================================
  # Backend: Express 5 + Socket.IO + Prisma v8 RC
  # ==========================================
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skillswap-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-skillswap}:${POSTGRES_PASSWORD:-skillswap_secure_password_prod}@db:5432/${POSTGRES_DB:-skillswap}?schema=public
      JWT_SECRET: ${JWT_SECRET:-insecure_jwt_secret_change_me_in_production_min_32_chars!}
      CSRF_SECRET: ${CSRF_SECRET:-insecure_csrf_secret_change_me_in_production_min_32_chars!}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      JITSI_APP_ID: ${JITSI_APP_ID:-skillswap-prod}
      JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.jit.si}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      LOG_LEVEL: info
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - skillswap-net

  # ==========================================
  # Frontend: React 19 + Vite 8 + Nginx SPA Proxy
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: skillswap-client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - skillswap-net

volumes:
  postgres_data:
    driver: local

networks:
  skillswap-net:
    driver: bridge

